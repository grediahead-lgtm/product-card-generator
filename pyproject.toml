[project]
name = "product-card-generator"
version = "0.1.0"
description = "Builds product titles and descriptions (UK/RU) from attributes with templates, and checks length, duplicates and risky claims. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dmytro Grechyshchev" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
